# Container release: build and test on every pull request; on main and on a
# version tag, publish a multi-arch (amd64 + arm64, Raspberry Pi) image to
# GHCR, signed with cosign, with a syft SBOM and build provenance attached.
#
# GHCR only, as before the migration: `dockerhub` stays off. Turning it on
# needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in Doppler (project netpulse,
# config ci), never in this repository's secrets. The jobs live in
# ChiefGyk3D/git-your-ship-together.
#
# Image: ghcr.io/chiefgyk3d/netpulse
name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of `latest` from main so base-image fixes reach the
    # published image between commits. Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@0f767f2e9f3954cf794ab76152114f9b632fd37a # verify: git-your-ship-together pull request 29, not a release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      dockerfile: speedtest-runner/Dockerfile
      context: speedtest-runner
      push: false   # verification only; never publish from this branch
      dockerhub: false
      docker-test-command: docker run --rm "$IMAGE" python -c "import speedtest_runner; print('Import successful')"
      egress-policy: block
      extra-allowed-endpoints: d3fo0g5hm7lbuv.cloudfront.net:443 packagecloud.io:443
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
