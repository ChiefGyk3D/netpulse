# Lint, a compile check on Python 3.10-3.14, Docker build with an import check.
# The jobs live in ChiefGyk3D/git-your-ship-together; this file only says what
# is specific to NetPulse.
name: CI

on:
  push:
    branches: [main, develop, copilot/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@8fdb8d106b11aae0f37e893bb57e9bd8e8b0e7b7 # v1.24.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04", "kalilinux/kali-rolling", "parrotsec/core"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      coverage-python-version: "3.14"
      lint-python-version: "3.14"
      install-command: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r speedtest-runner/requirements.txt
      # There is no test suite yet. The old workflow ran pytest against a
      # tests/ directory that does not exist and hid that behind
      # `|| echo "No tests found"`. A byte-compile of the runner on every
      # Python in the matrix is what can honestly be checked today, plus a config
      # check that the InfluxDB org and bucket agree across compose, Grafana and
      # the dashboard (scripts/check_config.py); replace
      # this with pytest when tests land, and turn on `codecov`.
      test-command: python -m compileall -q speedtest-runner && python scripts/check_config.py && python -m unittest discover -s tests
      lint-command: ruff check speedtest-runner/ --output-format=github
      dockerfile: speedtest-runner/Dockerfile
      docker-context: speedtest-runner
      docker-test-command: docker run --rm "$IMAGE" python -c "import speedtest_runner; print('Import successful')"
      egress-policy: block
      extra-allowed-endpoints: d3fo0g5hm7lbuv.cloudfront.net:443 packagecloud.io:443
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
